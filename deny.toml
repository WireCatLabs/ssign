# cargo-deny config for reviewing this fork. It checks only what `cargo install ssign` builds for Windows.
[graph]
targets = ["x86_64-pc-windows-msvc"]
exclude-dev = true

[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "OpenSSL", "MPL-2.0", "0BSD", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
